<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Cyber Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Circuit Trace Gradient: Electric Cyan to Vibrant Indigo -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Accent Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Border Subtle Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Cyber Rim -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#borderGrad)" stroke-width="1.5" fill="none" />

  <!-- Circuit Traces: Outer Loop forming C (Circuito) & Data Highways -->
  <!-- Main Circuit Arc (The 'C' Circuit Loop) -->
  <path 
    d="M 46 19 L 28 19 C 20.268 19 14 25.268 14 33 C 14 40.732 20.268 47 28 47 L 46 47" 
    stroke="url(#traceGrad)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Secondary Internal Circuit Trace (Branching Node) -->
  <path 
    d="M 23 33 L 37 33 L 44 26" 
    stroke="url(#traceGrad)" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Lower Branch Trace -->
  <path 
    d="M 37 33 L 44 40" 
    stroke="url(#traceGrad)" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- PCB Node Points / Terminals (Glowing Dots) -->
  <!-- Top Terminal (0001 Input) -->
  <circle cx="46" cy="19" r="4.5" fill="url(#nodeGrad)" filter="url(#glow)" />
  <circle cx="46" cy="19" r="2" fill="#ffffff" />

  <!-- Bottom Terminal -->
  <circle cx="46" cy="47" r="4.5" fill="url(#nodeGrad)" filter="url(#glow)" />
  <circle cx="46" cy="47" r="2" fill="#ffffff" />

  <!-- Top-Right Diagonal Branch Node -->
  <circle cx="44" cy="26" r="3.5" fill="#38bdf8" />
  <circle cx="44" cy="26" r="1.5" fill="#ffffff" />

  <!-- Bottom-Right Diagonal Branch Node -->
  <circle cx="44" cy="40" r="3.5" fill="#818cf8" />
  <circle cx="44" cy="40" r="1.5" fill="#ffffff" />

  <!-- Core Circuit Microchip Center Node -->
  <circle cx="23" cy="33" r="4.5" fill="url(#traceGrad)" />
  <circle cx="23" cy="33" r="2" fill="#ffffff" />

  <!-- Ambient Micro Tech Accent Dots (Subtle Binary Elements) -->
  <circle cx="26" cy="26" r="1" fill="#38bdf8" opacity="0.6" />
  <circle cx="26" cy="40" r="1" fill="#818cf8" opacity="0.6" />
</svg>
